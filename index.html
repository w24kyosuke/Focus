<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集中時間レコーダー（階層表示・エラー対策版）</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root { --primary: #4A90E2; --bg: #F5F7FA; --card-bg: #FFFFFF; --text: #333333; --border: #E1E4E8; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; margin: 0; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--bg); padding-bottom: 10px; margin-bottom: 15px; }
        h2 { margin: 0; font-size: 1.2rem; }
        .h2-normal { border-bottom: 2px solid var(--bg); padding-bottom: 10px; margin-bottom: 15px; margin-top: 0; }
        
        .sync-area { background-color: #E8F0FE; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .sync-area label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; color: #1967D2; }
        .btn-sync { background-color: #1967D2; color: white; }
        
        .flex-row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
        .input-label { font-size: 0.8rem; font-weight: bold; color: #666; display: block; margin-bottom: 8px; }
        input, select, button { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
        input[type="text"] { flex: 1; min-width: 120px; }
        select { flex: 1; min-width: 100px; }
        button { cursor: pointer; font-weight: bold; border: none; transition: opacity 0.2s; white-space: nowrap; }
        button:hover { opacity: 0.8; }
        
        /* 階層構造用のスタイル */
        .tags-container { max-height: 250px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; background: #fafafa; padding: 15px; margin-bottom: 15px; }
        .tag-category-group { margin-bottom: 15px; }
        .tag-category-group:last-child { margin-bottom: 0; }
        .category-title { font-size: 0.85rem; font-weight: bold; color: #555; margin-bottom: 8px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
        
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .cb-label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; background: #fff; padding: 8px 16px; border: 1px solid #ddd; border-radius: 20px; user-select: none; transition: 0.2s;}
        .cb-label:hover { background: #f0f0f0; }
        .cb-label input { margin: 0; cursor: pointer; width: 16px; height: 16px; }
        .empty-msg { font-size: 0.8rem; color: #999; padding: 4px 8px; }
        
        .timer-display { font-size: 4rem; font-weight: bold; text-align: center; margin: 20px 0; font-variant-numeric: tabular-nums; }
        .controls { display: flex; gap: 10px; justify-content: center; }
        .btn-start { background-color: var(--primary); color: white; width: 100px;}
        .btn-pause { background-color: #F5A623; color: white; width: 100px; display: none;}
        .btn-finish { background-color: #7ED321; color: white; width: 100px; display: none;}
        
        .period-toggle { display: flex; gap: 5px; }
        .btn-toggle { padding: 5px 12px; font-size: 0.8rem; background-color: #eee; color: #333; border-radius: 4px; }
        .btn-toggle.active { background-color: var(--primary); color: white; }

        .charts-grid { display: flex; flex-direction: column; gap: 20px; }
        .chart-container { position: relative; height: 260px; width: 100%; }
        .btn-export { background-color: #34495E; color: white; width: 100%; padding: 12px; font-size: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="card sync-area">
        <label>🔄 端末共有用 ID</label>
        <div class="flex-row" style="margin-bottom:0;">
            <input type="text" id="syncIdInput" placeholder="例: my-secret-id-123">
            <button class="btn-sync" onclick="CloudManager.handleLoadRequest()">読み込む</button>
        </div>
    </div>

    <div class="card">
        <h2 class="h2-normal">⏱ タイマー</h2>
        
        <div>
            <label class="input-label">🏷️ タグ（複数選択OK）</label>
            <div id="tagsContainer" class="tags-container">
                </div>
            
            <div class="flex-row" style="background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px dashed #ccc;">
                <select id="addCategorySelect"></select>
                <input type="text" id="newTagInput" placeholder="タグ名を追加">
                <button style="background: #eee;" onclick="UIManager.addNewTag()">タグ追加</button>
            </div>
            <div class="flex-row" style="margin-bottom: 0;">
                <input type="text" id="newCategoryInput" placeholder="新しいカテゴリを作る">
                <button style="background: #eee;" onclick="UIManager.addNewCategory()">カテゴリ追加</button>
            </div>
        </div>

        <div class="timer-display" id="timeDisplay">00:00:00</div>
        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="TimerManager.start()">スタート</button>
            <button class="btn-pause" id="pauseBtn" onclick="TimerManager.pause()">一時停止</button>
            <button class="btn-finish" id="finishBtn" onclick="TimerManager.finish()">終了</button>
        </div>
    </div>

    <div class="charts-grid">
        <div class="card">
            <div class="card-header">
                <h2>📊 日別の累計時間</h2>
                <div class="period-toggle">
                    <button id="btn7d" class="btn-toggle active" onclick="UIManager.changePeriod(7)">7日間</button>
                    <button id="btn30d" class="btn-toggle" onclick="UIManager.changePeriod(30)">30日間</button>
                </div>
            </div>
            <div class="chart-container"><canvas id="timeChart"></canvas></div>
        </div>
        <div class="card">
            <h2 class="h2-normal">📶 タグ別の累計時間 (全期間)</h2>
            <div class="chart-container"><canvas id="tagChart"></canvas></div>
        </div>
    </div>

    <div class="card">
        <h2 class="h2-normal">💾 データ管理</h2>
        <button class="btn-export" onclick="Utilities.exportCSV()">データをCSV形式で書き出す</button>
    </div>
</div>

<script>
    // ==========================================
    // 1. 設定・定数
    // ==========================================
    const CONFIG = {
        firebase: {
            apiKey: "AIzaSyAPSMfSsgmvMCnHEOsuTdFolANbkvtl_nM",
            authDomain: "foucus-7beee.firebaseapp.com",
            // ★欠けていた databaseURL を補完しています★
            databaseURL: "https://foucus-7beee-default-rtdb.firebaseio.com",
            projectId: "foucus-7beee",
            storageBucket: "foucus-7beee.firebasestorage.app",
            messagingSenderId: "217138760783",
            appId: "1:217138760783:web:7adc6011f8dee9e77bae3a",
            measurementId: "G-1V6KPRP678"
        },
        chartColors: ['#4A90E2', '#34A853', '#FBBC05', '#EA4335', '#9B59B6', '#1ABC9C', '#E67E22', '#7F8C8D'],
        tagBarColor: '#9B59B6',
        defaultTags: {
            "端末": ["Laptop", "iPad", "iPhone"],
            "Univ.": ["卒業研究", "レポート","リアぺ", "発表", "ツール開発"],
            "Language": ["KRE", "ESP","CHN","ENG","TOPIK","HSK"],
            "家計簿": ["レシート整理", "入力"],
        },
        dataRetentionDays: 30
    };

    const appState = {
        syncId: localStorage.getItem('lastSyncId') || '',
        records: [],
        tags: JSON.parse(JSON.stringify(CONFIG.defaultTags)),
        periodDays: 7,
        timer: { intervalId: null, startTime: null, elapsedMs: 0, isRunning: false }
    };

    const DOM = {
        syncIdInput: document.getElementById('syncIdInput'),
        tagsContainer: document.getElementById('tagsContainer'),
        addCategorySelect: document.getElementById('addCategorySelect'),
        newTagInput: document.getElementById('newTagInput'),
        newCategoryInput: document.getElementById('newCategoryInput'),
        timeDisplay: document.getElementById('timeDisplay'),
        btnStart: document.getElementById('startBtn'),
        btnPause: document.getElementById('pauseBtn'),
        btnFinish: document.getElementById('finishBtn'),
        btn7d: document.getElementById('btn7d'),
        btn30d: document.getElementById('btn30d')
    };

    const CloudManager = {
        db: null,
        isAvailable: false,

        init() {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(CONFIG.firebase);
                }
                this.db = firebase.database();
                this.isAvailable = true;
            } catch (e) {
                console.error("Firebaseの初期化に失敗しました。ローカルモードで動作します:", e);
            }
        },

        handleLoadRequest() {
            const inputId = DOM.syncIdInput.value.trim();
            if (!inputId) return alert("同期IDを入力してください！");
            
            if (!this.isAvailable) {
                alert("データベースに接続できません。設定を確認してください。");
                return;
            }
            this.loadData(inputId);
        },

        loadData(syncId) {
            if (!this.isAvailable) return;
            appState.syncId = syncId;
            localStorage.setItem('lastSyncId', syncId);

            this.db.ref(`users/${syncId}`).once('value').then((snapshot) => {
                const data = snapshot.val() || {};
                
                // タグのマイグレーション
                let mergedTags = JSON.parse(JSON.stringify(CONFIG.defaultTags));
                if (data.tags) {
                    if (Array.isArray(data.tags)) {
                        if (!mergedTags["その他"]) mergedTags["その他"] = [];
                        const allExisting = Object.values(mergedTags).flat();
                        data.tags.forEach(t => {
                            if (!allExisting.includes(t) && t !== "一般") {
                                mergedTags["その他"].push(t);
                            }
                        });
                    } else {
                        Object.keys(data.tags).forEach(cat => {
                            if (cat === "-" || cat === "未分類") {
                                if (!mergedTags["その他"]) mergedTags["その他"] = [];
                                data.tags[cat].forEach(t => { if (!mergedTags["その他"].includes(t)) mergedTags["その他"].push(t); });
                            } else {
                                if (!mergedTags[cat]) mergedTags[cat] = [];
                                data.tags[cat].forEach(t => {
                                    if (t !== "一般" && !mergedTags[cat].includes(t)) mergedTags[cat].push(t);
                                });
                            }
                        });
                    }
                }
                appState.tags = mergedTags;

                // 記録データのマイグレーション
                appState.records = (data.records || []).map(r => {
                    let currentTags = r.tags || [];
                    if (currentTags.length === 0) {
                        if (r.mainTag && r.mainTag !== "未分類" && r.mainTag !== "-") currentTags.push(r.mainTag);
                        if (r.subTags) currentTags = currentTags.concat(r.subTags);
                        else if (r.subTag) currentTags.push(r.subTag);
                        if (r.tag) currentTags.push(r.tag);
                    }
                    r.tags = Array.from(new Set(currentTags.filter(t => t && t !== "一般")));
                    if (r.tags.length === 0) r.tags = ["タグなし"];
                    return r;
                });

                UIManager.renderTags();
                ChartManager.updateAll();
            }).catch(error => {
                console.error("データの読み込みに失敗しました:", error);
                alert("データベースからの読み込みに失敗しました。");
            });
        },

        saveData() {
            if (!this.isAvailable || !appState.syncId) return;
            
            const limitDate = new Date();
            limitDate.setDate(limitDate.getDate() - CONFIG.dataRetentionDays);
            const limitStr = limitDate.toISOString().split('T')[0];
            appState.records = appState.records.filter(r => r.date >= limitStr);

            this.db.ref(`users/${appState.syncId}`).set({
                records: appState.records,
                tags: appState.tags
            }).catch(error => {
                console.error("データの保存に失敗しました:", error);
            });
        }
    };

    const TimerManager = {
        start() {
            if (appState.timer.isRunning) return;
            appState.timer.isRunning = true;
            appState.timer.startTime = Date.now();
            appState.timer.intervalId = setInterval(() => this.updateDisplay(), 100);
            UIManager.updateTimerButtons('running');
        },

        pause() {
            if (!appState.timer.isRunning) return;
            appState.timer.isRunning = false;
            appState.timer.elapsedMs += Date.now() - appState.timer.startTime;
            clearInterval(appState.timer.intervalId);
            UIManager.updateTimerButtons('paused');
        },

        finish() {
            if (appState.timer.isRunning) appState.timer.elapsedMs += Date.now() - appState.timer.startTime;
            clearInterval(appState.timer.intervalId);
            appState.timer.isRunning = false;

            if (appState.timer.elapsedMs > 1000) {
                const checkedInputs = Array.from(DOM.tagsContainer.querySelectorAll('input:checked'));
                const selectedTags = checkedInputs.map(input => input.value);
                if (selectedTags.length === 0) selectedTags.push("タグなし");

                appState.records.push({
                    date: new Date().toISOString().split('T')[0],
                    tags: selectedTags,
                    duration: appState.timer.elapsedMs / (1000 * 60)
                });
                CloudManager.saveData();
                ChartManager.updateAll();
            }

            this.reset();
            UIManager.updateTimerButtons('stopped');
        },

        reset() {
            appState.timer.elapsedMs = 0;
            this.updateDisplay();
        },

        updateDisplay() {
            const { isRunning, elapsedMs, startTime } = appState.timer;
            const currentMs = isRunning ? elapsedMs + (Date.now() - startTime) : elapsedMs;
            DOM.timeDisplay.textContent = Utilities.formatTime(currentMs);
        }
    };

    const ChartManager = {
        barInstance: null,
        tagBarInstance: null,

        updateAll() {
            this.updateBarChart();
            this.updateTagChart();
        },

        updateBarChart() {
            const days = appState.periodDays;
            const dates = Array.from({length: days}, (_, i) => {
                const d = new Date();
                d.setDate(d.getDate() - (days - 1 - i));
                return d.toISOString().split('T')[0];
            });

            const dataMap = dates.reduce((acc, date) => ({ ...acc, [date]: 0 }), {});
            appState.records.forEach(r => {
                if (dataMap[r.date] !== undefined) dataMap[r.date] += r.duration;
            });

            const labels = dates.map(d => d.split('-').slice(1).join('/'));
            const dataPoints = dates.map(d => (dataMap[d] / 60).toFixed(1));

            if (this.barInstance) this.barInstance.destroy();
            this.barInstance = new Chart(document.getElementById('timeChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '累計時間 (時間)',
                        data: dataPoints,
                        backgroundColor: CONFIG.chartColors[0],
                        borderRadius: days === 7 ? 4 : 2
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        },

        updateTagChart() {
            const tagMap = {};
            appState.records.forEach(r => {
                const currentTags = r.tags || ['タグなし'];
                currentTags.forEach(tag => {
                    tagMap[tag] = (tagMap[tag] || 0) + r.duration;
                });
            });

            const sortedTags = Object.entries(tagMap).sort((a, b) => b[1] - a[1]);
            const labels = sortedTags.map(item => item[0]);
            const dataPoints = sortedTags.map(item => (item[1] / 60).toFixed(1));

            if (this.tagBarInstance) this.tagBarInstance.destroy();
            this.tagBarInstance = new Chart(document.getElementById('tagChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: labels.length ? labels : ['データなし'],
                    datasets: [{
                        label: '累計時間 (時間)',
                        data: dataPoints.length ? dataPoints : [0],
                        backgroundColor: CONFIG.tagBarColor,
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { beginAtZero: true } }
                }
            });
        }
    };

    const UIManager = {
        init() {
            // アプリ起動時は常にUIを描画する
            this.renderTags();
            ChartManager.updateAll();
            
            // 過去の同期IDがあれば自動読み込みを試みる
            if (appState.syncId && CloudManager.isAvailable) {
                DOM.syncIdInput.value = appState.syncId;
                CloudManager.loadData(appState.syncId);
            }
        },

        renderTags() {
            const checkedBoxes = Array.from(DOM.tagsContainer.querySelectorAll('input:checked')).map(cb => cb.value);
            
            let html = '';
            for (const [category, tagsList] of Object.entries(appState.tags)) {
                html += `
                <div class="tag-category-group">
                    <div class="category-title">📁 ${category}</div>
                    <div class="checkbox-group">
                        ${tagsList.length > 0 
                            ? tagsList.map(t => {
                                const isChecked = checkedBoxes.includes(t) ? 'checked' : '';
                                return `<label class="cb-label"><input type="checkbox" value="${t}" ${isChecked}> ${t}</label>`;
                            }).join('')
                            : `<span class="empty-msg">（まだタグがありません）</span>`
                        }
                    </div>
                </div>`;
            }
            DOM.tagsContainer.innerHTML = html;

            const currentCat = DOM.addCategorySelect.value;
            DOM.addCategorySelect.innerHTML = Object.keys(appState.tags).map(c => `<option value="${c}">${c}</option>`).join('');
            if (appState.tags[currentCat]) DOM.addCategorySelect.value = currentCat;
        },

        addNewTag() {
            const category = DOM.addCategorySelect.value;
            const newTag = DOM.newTagInput.value.trim();
            
            if (category && newTag) {
                const allExisting = Object.values(appState.tags).flat();
                if (!allExisting.includes(newTag)) {
                    appState.tags[category].push(newTag);
                    CloudManager.saveData();
                    DOM.newTagInput.value = '';
                    this.renderTags();
                    
                    setTimeout(() => {
                        const newCheckbox = Array.from(DOM.tagsContainer.querySelectorAll('input')).find(cb => cb.value === newTag);
                        if (newCheckbox) newCheckbox.checked = true;
                    }, 50);
                } else {
                    alert("そのタグは既に存在しています。");
                }
            }
        },

        addNewCategory() {
            const newCat = DOM.newCategoryInput.value.trim();
            if (newCat && !appState.tags[newCat]) {
                appState.tags[newCat] = []; 
                CloudManager.saveData();
                DOM.newCategoryInput.value = '';
                this.renderTags(); 
                DOM.addCategorySelect.value = newCat; 
            }
        },

        updateTimerButtons(status) {
            const { btnStart, btnPause, btnFinish } = DOM;
            const checkboxes = DOM.tagsContainer.querySelectorAll('input');

            if (status === 'running') {
                btnStart.style.display = 'none';
                btnPause.style.display = 'block';
                btnFinish.style.display = 'block';
                checkboxes.forEach(cb => cb.disabled = true);
            } else if (status === 'paused') {
                btnStart.style.display = 'block';
                btnStart.textContent = '再開';
                btnPause.style.display = 'none';
            } else if (status === 'stopped') {
                btnStart.style.display = 'block';
                btnStart.textContent = 'スタート';
                btnPause.style.display = 'none';
                btnFinish.style.display = 'none';
                checkboxes.forEach(cb => cb.disabled = false);
            }
        },

        changePeriod(days) {
            appState.periodDays = days;
            DOM.btn7d.classList.toggle('active', days === 7);
            DOM.btn30d.classList.toggle('active', days === 30);
            ChartManager.updateBarChart();
        }
    };

    const Utilities = {
        formatTime(ms) {
            const totalSec = Math.floor(ms / 1000);
            const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            const s = String(totalSec % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        },

        exportCSV() {
            if (appState.records.length === 0) return alert('書き出すデータがありません。');
            
            let csvContent = "\uFEFF日付,タグ(複数),集中時間(分),集中時間(時間)\n";
            appState.records.forEach(r => {
                const hours = (r.duration / 60).toFixed(2);
                const tagsStr = (r.tags && r.tags.length > 0) ? r.tags.join(' & ') : 'タグなし';
                csvContent += `${r.date},${tagsStr},${r.duration.toFixed(1)},${hours}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `focus_time_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }
    };

    window.onload = () => {
        CloudManager.init();
        UIManager.init();
    };
</script>

</body>
</html>
